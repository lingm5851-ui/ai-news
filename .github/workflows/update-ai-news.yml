name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      - name: Update data
        run: pnpm run fetch

      - name: Generate OPML JSON
        run: npx tsx src/generate-opml-json.ts

      - name: Build web
        env:
          GITHUB_PAGES: true
        run: |
          cd web
          pnpm install
          pnpm run build
          mkdir -p dist/data
          cp ../data/latest-24h.json dist/data/
          cp ../data/latest-7d.json dist/data/
          cp ../data/source-status.json dist/data/
          cp ../data/opml-feeds.json dist/data/ 2>/dev/null || true

      - name: Deploy built files to main branch root
        run: |
          # Copy built files to repo root
          cp -r web/dist/* .
          
          # Commit and push
          git config user.name "github-actions-bot"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git add -f index.html assets/ data/
          git commit -m "deploy: update site" --allow-empty
          git push
